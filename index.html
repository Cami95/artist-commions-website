<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Art Website</title>
    <style>
      h1 {
        text-align: center;
        background: blue;
        color: white;
        padding: 40px;
        margin: 5px;
      }

      img {
        width: 500px;
        display: block;
        margin: 50px auto 0 auto;
        padding: 20px;
        background: purple;
        border: 20px dashed blueviolet;
        border-radius: 50px;
      }

      img:hover {
        background: pink;
      }

      button {
        display: block;
        margin: 20px auto 0 auto;
        padding: 15px 20px;
        background: blueviolet;
        color: white;
        border: 1px solid black;
        border-radius: 40px;
        transition: all 2ms cubic-bezier(0.37, 0, 0.63, 1);
      }

      button:hover {
        background: white;
        color: blueviolet;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>
      Everything is Awesome!
      <br />
      Everything is cool when your part of a
      <br />
      team of Creative Minds!!
    </h1>

    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTT9uEcmf9m7TFiQHVEQUAZ3VN2Pm96IGhDGiwK4JUjWkPU8hj6pRX1s1AB&s=10"
      alt="women of color coding"
    />

    <button>I have an Idea!!</button>
  </body>
</html>
